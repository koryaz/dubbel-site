<!doctype html>
<html lang="en">
<head>

<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A note for you</title>
<meta name="description" content="A friend left you a note in Dubbel.">
<meta property="og:title" content="A note for you">
<meta property="og:description" content="A friend left you a note in Dubbel.">

<!-- No JavaScript on this page, by design: the note lives in the URL fragment and no code may read it. -->
<style>
:root{--bg:#fbf8f3;--fg:#1d1a16;--muted:#6b645a;--accent:#a56a1c;--on-accent:#fff;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#141210;--fg:#f1ebe2;--muted:#a39b8f;--accent:#e2a24a;--on-accent:#141210}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:680px;margin:0 auto;padding:48px 20px 80px}
.brand{font-weight:700;font-size:20px;margin:0 0 40px}
h1{font-size:30px;line-height:1.2;margin:0 0 8px}
p{max-width:62ch}
.lede{color:var(--muted);margin-top:0}
.store{display:inline-block;margin:24px 0 8px;padding:14px 28px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:600;text-decoration:none}
.meta{color:var(--muted);font-size:15px}
</style>
</head>
<body>
<main>
<p class="brand">Dubbel</p>
<h1>Someone left you a note in Dubbel.</h1>
<p class="lede">Dubbel locks apps before a night out and shows you a note when you try to open one.</p>
<!-- TODO before merge: replace APP_STORE_ID with the numeric App Store ID (App Store Connect › App Information › Apple ID). -->
<a class="store" href="https://apps.apple.com/app/idAPP_STORE_ID?ct=friendnote">Get Dubbel on the App Store</a>
<p class="meta">Already have Dubbel? Tap the link again.</p>
</main>
</body>
</html>
